#cloud-config

hostname: ${hostname}
preserve_hostname: false
manage_etc_hosts: localhost

ssh_pwauth: false

users:
  - name: ops
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

locale: en_US.UTF-8

timezone: ${timezone}

%{ if is_vultr ~}
# Run package updates in Weft's boot script, after selecting the mirror.
package_update: false
package_upgrade: false

%{ endif ~}
ntp:
  enabled: true
  servers:
%{ for server in ntp_servers ~}
    - ${server}
%{ endfor ~}

write_files:
%{ if is_vultr ~}
  # Clear earlier system-wide sources on images where cloud-init selects timesyncd.
  - path: /etc/systemd/timesyncd.conf.d/zz-weft-ntp.conf
    content: |
      [Time]
      NTP=
      NTP=${join(" ", ntp_servers)}

%{ endif ~}
  # sshd keeps the first value it reads for each keyword and reads sshd_config.d in name order, so weft's files start
  # with 0 to come before anything the image ships (50-cloud-init.conf and the like).
  - path: /etc/ssh/sshd_config.d/01-weft-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PermitRootLogin no
      AllowUsers ops
      MaxAuthTries 3
      MaxSessions 6
      LoginGraceTime 20
      MaxStartups 10:30:60
      ClientAliveInterval 300
      ClientAliveCountMax 2
      PermitUserEnvironment no
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding ${ssh_forwarding ? "yes" : "no"}
      AllowStreamLocalForwarding no
      GatewayPorts no
      PermitTunnel no

  # Modern key exchange, ciphers and MACs only. runcmd drops this file again if this sshd does not know one of them,
  # so a newer list can never leave the box without sshd.
  - path: /etc/ssh/sshd_config.d/02-weft-ciphers.conf
    content: |
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=1

  - path: /etc/sysctl.d/98-weft-hardening.conf
    content: |
      # No redirects or source routes, strict reverse-path checks, logged martians
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.all.secure_redirects=0
      net.ipv4.conf.default.secure_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.send_redirects=0
      net.ipv4.conf.all.accept_source_route=0
      net.ipv4.conf.default.accept_source_route=0
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.default.rp_filter=1
      net.ipv4.conf.all.log_martians=1
      net.ipv4.conf.default.log_martians=1
      net.ipv4.icmp_echo_ignore_broadcasts=1
      net.ipv4.icmp_ignore_bogus_error_responses=1
      net.ipv4.tcp_syncookies=1
      net.ipv4.tcp_rfc1337=1
      # Kernel pointers, logs, BPF and ptrace out of reach of unprivileged code
      kernel.kptr_restrict=2
      kernel.dmesg_restrict=1
      kernel.unprivileged_bpf_disabled=1
      net.core.bpf_jit_harden=2
      kernel.yama.ptrace_scope=1
      kernel.sysrq=0
      fs.suid_dumpable=0
      fs.protected_hardlinks=1
      fs.protected_symlinks=1
      fs.protected_fifos=2
      fs.protected_regular=2
%{ if tunnel ~}
      # Tunnel egress: forward tunnel clients' IPv4 out (weft-egress.nft decides what may be forwarded)
      net.ipv4.ip_forward=1
%{ endif ~}
%{ if disable_ipv6 ~}

  - path: /etc/sysctl.d/98-weft-noipv6.conf
    content: |
      net.ipv6.conf.all.disable_ipv6=1
      net.ipv6.conf.default.disable_ipv6=1
%{ endif ~}
%{ if tunnel ~}

  - path: /usr/local/sbin/weft-peer
    permissions: '0755'
    content: |
      ${indent(6, weft_peer)}

  # Tunnel clients reach the public internet and nothing else: not the cloud metadata service, not private or
  # shared address space, not each other. Their traffic leaves masqueraded as the server's address.
  - path: /etc/weft/egress.nft
    content: |
      ${indent(6, egress_nft)}

  - path: /etc/systemd/system/weft-egress.service
    content: |
      [Unit]
      Description=weft: tunnel egress filter and NAT (/etc/weft/egress.nft)
      Before=wg-quick@wg0.service
      After=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/weft/egress.nft
      ExecStop=/usr/sbin/nft delete table inet weft_egress

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/wg-quick@wg0.service.d/10-weft.conf
    content: |
      [Unit]
      Requires=weft-egress.service
      After=weft-egress.service
%{ endif ~}

  - path: /etc/apt/apt.conf.d/99-no-unattended
    content: |
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::Update-Package-Lists "0";

  - path: /etc/apt/preferences.d/no-unattended-upgrades
    content: |
      Package: unattended-upgrades
      Pin: release *
      Pin-Priority: -1

runcmd:
  - setup_status=0
  - systemctl mask unattended-upgrades.service
  - apt-get remove -y unattended-upgrades || true

  # Point APT at a nearby mirror (Vultr images ship the generic one; AWS AMIs
  # already have a regional mirror, so apt_mirror is empty there). Reverts to
  # the image default if the mirror turns out not to work.
  - |
    mirror='${apt_mirror}'
    files='/etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list'
    apt_updated=true
    if [ -n "$mirror" ]; then
      for f in $files; do
        if [ -f "$f" ]; then
          sed -i.weft-bak "s|http://archive.ubuntu.com/ubuntu|$mirror|g" "$f"
        fi
      done
      if ! apt-get -o APT::Update::Error-Mode=any update; then
        echo "weft: APT mirror $mirror failed, reverting to the image default"
        for f in $files; do
          if [ -f "$f.weft-bak" ]; then mv "$f.weft-bak" "$f"; fi
        done
        apt-get -o APT::Update::Error-Mode=any update || apt_updated=false
      fi
    else
      apt-get -o APT::Update::Error-Mode=any update || apt_updated=false
    fi
    if [ "$apt_updated" = false ]; then
      echo 'weft: APT refresh failed, trying package installs with cached indexes' >&2
      setup_status=1
    fi

  # Install base packages
  - apt-get install -y curl git jq ufw net-tools rsync unzip ca-certificates vim-tiny dnsutils ncdu lsof tcpdump atop || setup_status=1
%{ if tunnel ~}
  - apt-get install -y wireguard-tools nftables || setup_status=1
%{ endif ~}

  # Configure UFW
%{ if disable_ipv6 ~}
  - sed -i 's/^IPV6=.*/IPV6=no/' /etc/default/ufw
%{ endif ~}
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw default deny routed
%{ if length(ssh_allowed_cidrs) == 0 || contains(ssh_allowed_cidrs, "0.0.0.0/0") ~}
  - ufw limit 22/tcp
%{ else ~}
%{ for cidr in ssh_allowed_cidrs ~}
  - ufw limit from ${cidr} to any port 22 proto tcp
%{ endfor ~}
  # Vultr's Ubuntu image ships with 22/tcp open to all, which the rules above only add to
  - ufw delete allow 22/tcp || true
%{ endif ~}
%{ if tunnel ~}
  # The tunnel: its UDP port from anywhere, SSH from inside it, and tunnel clients routed out the public interface
  - ufw allow ${tunnel_port}/udp
  - ufw allow in on wg0 to any port 22 proto tcp
  - ufw route allow in on wg0 out on "$(ip -o -4 route show default | awk '{print $5; exit}')"
%{ endif ~}
  - ufw --force enable || setup_status=1

  # Apply sysctl (hardening, swap, and IPv6 off when asked)
  - sysctl --system || setup_status=1

  # Ensure ops user has SSH key (belt-and-suspenders, some providers
  # don't reliably process ssh_authorized_keys in the users block)
  - |
    ssh_dir=/home/ops/.ssh
    keys="$ssh_dir/authorized_keys"
    mkdir -p "$ssh_dir" &&
      echo '${ssh_public_key}' >> "$keys" &&
      sort -u -o "$keys" "$keys" &&
      chmod 700 "$ssh_dir" &&
      chmod 600 "$keys" &&
      chown -R ops:ops "$ssh_dir" || setup_status=1

  # Remove root SSH access
  - rm -f /root/.ssh/authorized_keys || setup_status=1

  # Restart sshd to apply hardening; a cipher list this sshd cannot parse is dropped rather than locking us out
  - mkdir -p /run/sshd
  - |
    if ! sshd -t; then
      echo "weft: dropping 02-weft-ciphers.conf, sshd -t refused it"
      rm -f /etc/ssh/sshd_config.d/02-weft-ciphers.conf
    fi
    sshd -t && systemctl restart sshd || setup_status=1
%{ if tunnel ~}

  # Create the WireGuard key locally. `./weft.sh tunnel` reads its public half over SSH.
  - |
    (
      set -e
      umask 077
      mkdir -p /etc/wireguard
      [ -s /etc/wireguard/server.key ] || wg genkey > /etc/wireguard/server.key
      wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
      chmod 644 /etc/wireguard/server.pub
      if [ ! -f /etc/wireguard/wg0.conf ]; then
        printf '%s\n' '[Interface]' 'Address = ${tunnel_address}' 'ListenPort = ${tunnel_port}' \
          'PostUp = wg set %i private-key /etc/wireguard/server.key' > /etc/wireguard/wg0.conf
      fi
      systemctl daemon-reload
      systemctl enable --now weft-egress.service wg-quick@wg0.service
    )
    [ "$?" -eq 0 ] || setup_status=1
%{ endif ~}

  # Upgrade after runtime setup, using freshly downloaded indexes.
  - |
    if [ "$apt_updated" = true ]; then
      DEBIAN_FRONTEND=noninteractive apt-get -y --no-remove -o Dpkg::Options::=--force-confold upgrade --with-new-pkgs || setup_status=1
    fi
    exit "$setup_status"
