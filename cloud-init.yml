#cloud-config

hostname: ${hostname}
preserve_hostname: false
manage_etc_hosts: localhost

ssh_pwauth: false

users:
  - name: ops
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

locale: en_US.UTF-8

timezone: ${timezone}

ntp:
  enabled: true
%{ if length(ntp_servers) > 0 ~}
  servers:
%{ for server in ntp_servers ~}
    - ${server}
%{ endfor ~}
%{ endif ~}

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowAgentForwarding no

  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=1

  - path: /etc/apt/apt.conf.d/99-no-unattended
    content: |
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::Update-Package-Lists "0";

  - path: /etc/apt/preferences.d/no-unattended-upgrades
    content: |
      Package: unattended-upgrades
      Pin: release *
      Pin-Priority: -1

runcmd:
  - systemctl mask unattended-upgrades.service
  - apt-get remove -y unattended-upgrades || true

  # Point APT at a nearby mirror (Vultr images ship the generic one; AWS AMIs
  # already have a regional mirror, so apt_mirror is empty there). Reverts to
  # the image default if the mirror turns out not to work.
  - |
    mirror='${apt_mirror}'
    files='/etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list'
    if [ -n "$mirror" ]; then
      for f in $files; do
        if [ -f "$f" ]; then
          sed -i.weft-bak "s|http://archive.ubuntu.com/ubuntu|$mirror|g" "$f"
        fi
      done
      if ! apt-get update; then
        echo "weft: APT mirror $mirror failed, reverting to the image default"
        for f in $files; do
          if [ -f "$f.weft-bak" ]; then mv "$f.weft-bak" "$f"; fi
        done
        apt-get update
      fi
    else
      apt-get update
    fi

  # Install base packages
  - apt-get install -y curl git jq ufw net-tools rsync unzip ca-certificates vim-tiny dnsutils ncdu lsof tcpdump atop

  # Configure UFW
  - ufw default deny incoming
  - ufw default allow outgoing
%{ if length(ssh_allowed_cidrs) == 0 || contains(ssh_allowed_cidrs, "0.0.0.0/0") ~}
  - ufw allow 22/tcp
%{ else ~}
%{ for cidr in ssh_allowed_cidrs ~}
  - ufw allow from ${cidr} to any port 22 proto tcp
%{ endfor ~}
%{ endif ~}
  - ufw --force enable

  # Apply sysctl
  - sysctl -p /etc/sysctl.d/99-swap.conf

  # Ensure ops user has SSH key (belt-and-suspenders, some providers
  # don't reliably process ssh_authorized_keys in the users block)
  - mkdir -p /home/ops/.ssh
  - echo '${ssh_public_key}' >> /home/ops/.ssh/authorized_keys
  - sort -u -o /home/ops/.ssh/authorized_keys /home/ops/.ssh/authorized_keys
  - chmod 700 /home/ops/.ssh
  - chmod 600 /home/ops/.ssh/authorized_keys
  - chown -R ops:ops /home/ops/.ssh

  # Remove root SSH access
  - rm -f /root/.ssh/authorized_keys

  # Restart sshd to apply hardening
  - systemctl restart sshd
